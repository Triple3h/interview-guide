server {
    listen 80;

    # HTTPS：与 80 复用同一个 server 块，/、/api/、/ws/ 的配置自动共享，
    # 避免拆成两个块时漏配（漏掉 /ws/ 会让语音面试直接挂）。
    # 证书由本地自建 CA 签发（SAN = IP:159.75.135.213），APK 内置该 CA 后无感信任；
    # 证书文件由 scripts/deploy-tc-cloud.sh 从 frontend/certs/ 同步，不入库。
    listen 443 ssl;
    server_name localhost;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:2m;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Allow larger file uploads
    client_max_body_size 50M;

    # index.html 不缓存：产物文件名带 hash 会自动失效，但 index.html 被缓存会导致前端更新后仍加载旧包
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Increase timeout for long-running AI requests
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 语音面试 WebSocket（token 走查询参数，握手由 app 侧校验）
    location /ws/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 语音面试单场时长 + 余量
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
