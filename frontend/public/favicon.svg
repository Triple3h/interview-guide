<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!--
    品牌 Logo「成长弧」：一条由缓到陡的上升曲线 + 右上一颗 AI 星。
    白底 + 单色图形（DeepSeek 式极简）；主色取手机端皮肤 #4d6bfe。
    同一图形也用于安卓 APK 图标与启动图，改这里时需同步 android/res 下的位图。
  -->
  <defs>
    <linearGradient id="brandArc" gradientUnits="userSpaceOnUse" x1="14" y1="20" x2="86" y2="76">
      <stop offset="0%" stop-color="#4d6bfe"/>
      <stop offset="100%" stop-color="#3b5bf0"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="22" fill="#ffffff"/>
  <path d="M20 72C38 72 46 64 52 50C56 40 60 36 66 34"
        stroke="url(#brandArc)" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M76 15l2.7 6.3L85 24l-6.3 2.7L76 33l-2.7-6.3L67 24l6.3-2.7z" fill="#fbbf24"/>
</svg>
