# ==============================================================================
# 统一入口：https://159.75.135.213/
#
# 当前只有 interview-guide 挂在根路径。将来接入新项目时，在下面追加带前缀的
# location（例如 /wanderinn/），同时那个项目自己要支持子路径
# （vite base + router basename + API 前缀），否则它的 /api 会和别人撞车。
# ==============================================================================

# WebSocket 升级用的连接头映射（语音面试 /ws/voice-interview/{id} 需要）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # 上传简历 / 知识库文档
    client_max_body_size 50M;

    # ---------------------------------------------------------------- 根路径
    # interview-guide：前端容器映射在宿主机 18080（容器内 nginx 的 80）
    location / {
        proxy_pass http://127.0.0.1:18080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 用 $remote_addr 覆写而不是 $proxy_add_x_forwarded_for：
        # 后端按 X-Forwarded-For 的第一段做限流，若沿用客户端自带的 XFF，
        # 伪造一个 IP 就能绕过限流。网关就在第一跳，直接写真实来源即可。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket（语音面试）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # SSE 流式（学习帮手）：必须关缓冲，否则回答会被攒着一次性吐出
        proxy_buffering off;
        proxy_cache off;

        # 长连接：语音面试单场最长 1 小时，AI 请求最长 5 分钟
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 30s;
    }

    # ------------------------------------------------- 将来接入其他项目示例
    # location /wanderinn/ {
    #     proxy_pass http://127.0.0.1:18090/;      # 注意行尾的斜杠：去掉前缀
    #     proxy_http_version 1.1;
